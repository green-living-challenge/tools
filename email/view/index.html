<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A Green Living Challenge resident email with the latest numbers, ready to copy into Gmail.">
  <title>GLC email</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234A1526'/%3E%3Cpath d='M10 22c0-8 5-12 13-12-1 8-5 12-13 12z' fill='%23F5F0E8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="view.css">
  <script defer src="../hub-logic.js"></script>
  <script defer src="../hub-data.js"></script>
  <script defer src="../email-build.js"></script>
  <script defer src="view.js"></script>
</head>
<body>
  <!-- The bar cannot be selected, so select all and copy takes only the email below it. -->
  <header class="bar" aria-label="Email actions">
    <div class="bar-inner">
      <p class="title">GLC email, ready to copy</p>
      <div class="actions">
        <button type="button" class="primary" id="copy-email" disabled>Copy email</button>
        <button type="button" id="copy-subject" disabled>Copy subject</button>
        <button type="button" id="refresh" disabled>Refresh numbers</button>
        <a id="edit" class="edit" href="../">Edit in the builder</a>
      </div>
      <p class="subject" id="subject"></p>
      <p class="status" id="status">Loading the latest numbers...</p>
      <p class="warning" id="warning" hidden></p>
      <p class="message" id="message" role="status"></p>
      <p class="hint">Click <strong>Copy email</strong>, open a new Gmail message and paste with Ctrl+V (Cmd+V on a Mac). Then copy the subject into the subject line. The numbers are the latest at the moment this page loaded.</p>
    </div>
  </header>
  <main id="email" aria-label="The email"></main>
  <noscript><p class="nojs">This page needs JavaScript.</p></noscript>
</body>
</html>
